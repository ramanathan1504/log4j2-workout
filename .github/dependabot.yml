# Dependency updates, opened as pull requests.
#
# This repository builds nineteen sample applications against several Log4j
# versions, so the dependency surface is real -- and a bench that silently rots
# against old Spring, Jakarta or driver versions stops representing what users
# actually run, which is the entire point of it.
#
# Grouped for routine bumps: ungrouped Dependabot across this many modules opens
# a wall of pull requests, each costing a ~13-minute matrix run, and the result
# is merged unread. Security updates stay ungrouped so a CVE fix lands alone.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # repros/ pin the exact versions a bug was reproduced on; a bump destroys the repro.
    exclude-paths:
      - "repros/**"
    # Log4j is the axis under test, chosen per run by pack.sh (-Dlog4j.version), and
    # log4j:log4j 1.2.17 is kept for the 1.x comparison. commons-compress is held
    # below 1.28.0 so the zstd codec cells still see what users on 1.26/1.27 get.
    # ignore applies to security updates too, so none of these opens a pull request.
    ignore:
      - dependency-name: "org.apache.logging.log4j:*"
      - dependency-name: "log4j:log4j"
      - dependency-name: "org.apache.commons:commons-compress"
    groups:
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
