status = WARN
appender.file.type = File
appender.file.name = File
appender.file.fileName = ${sys:outdir}/app.log
appender.file.append = false
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %c|%m|subsystem=%X{subsystem}|region=%X{region}%n

logger.db.name = app.db
logger.db.level = INFO
logger.db.property.type = Property
logger.db.property.name = subsystem
logger.db.property.value = Database

rootLogger.level = INFO
rootLogger.appenderRef.file.ref = File
rootLogger.property.type = Property
rootLogger.property.name = region
rootLogger.property.value = eu-west
