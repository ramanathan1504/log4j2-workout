status = WARN
name = PropertiesFilterAttributeCase

appender.file.type = File
appender.file.name = File
appender.file.fileName = ${sys:out}/app.log
appender.file.append = false
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %m%n

logger.rules.name = com.example.rules
logger.rules.level = INFO
logger.rules.additivity = false
logger.rules.appenderRef.file.ref = File
logger.rules.filter.marker.type = MarkerFilter
logger.rules.filter.marker.marker = FULL_PLAN
logger.rules.filter.marker.onMatch = DENY
logger.rules.filter.marker.onMisMatch = ACCEPT

rootLogger.level = ERROR
