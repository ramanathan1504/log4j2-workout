# Every built-in lookup, used from a CONFIGURATION, in YAML.
# Mirrors configs/xml/lookups.xml. Feature matrix §9, §11.
#
# The `lookups` scenario resolves these through a live StrSubstitutor. This file
# exercises the other path:
#
#   $   resolved ONCE, while the configuration is built — right for a file name
#   $$  deferred, resolved per event — required for MDC, markers, structured data
#
# Use $ where $$ was meant and every event silently gets the value the first one
# had.
#
# An unresolvable lookup does NOT become empty: the expression is left verbatim,
# so ${ctx:missing} appears literally. Literal text means unresolved, empty means
# resolved-to-empty, and they are different failures.
#
# Four resolve to nothing here by design, kept so their absence is visible:
# ${docker:} needs the Docker API, ${web:} a ServletContext, ${spring:} a Spring
# Environment, and ${jndi:} has been off by default since 2.17.0 unless
# log4j2.enableJndiLookup is set — which this bench deliberately does not set.

Configuration:
  status: WARN
  name: lookups

  Properties:
    Property:
      - name: dir
        value: ${sys:bench.log.dir:-logs}/lookups

      # ${sys:} — system properties, with a default after :-
      - name: javaVersion
        value: ${sys:java.version}
      - name: userName
        value: ${sys:user.name:-unknown}

      # ${env:} — environment variables, same default syntax
      - name: home
        value: ${env:HOME:-no-home}
      - name: benchEnv
        value: ${env:BENCH_ENV:-unset}

      # ${java:} — a fixed set of keys, not arbitrary properties
      - name: javaRuntime
        value: ${java:runtime}
      - name: javaVm
        value: ${java:vm}
      - name: javaOs
        value: ${java:os}
      - name: javaLocale
        value: ${java:locale}
      - name: javaHw
        value: ${java:hw}

      # ${date:} — the CONFIGURATION's build time, not the event time. This is
      # why a file name built from ${date:} does not roll.
      - name: startDate
        value: ${date:yyyy-MM-dd}

      # ${bundle:} — a ResourceBundle on the classpath, the only lookup needing
      # something there rather than in the environment. See
      # apps/core-java/src/main/resources/bench-messages.properties
      - name: appName
        value: ${bundle:bench-messages:app.name}
      - name: appTier
        value: ${bundle:bench-messages:app.tier}

      # ${lower:} / ${upper:} — usually wrapped around another lookup
      - name: tierUpper
        value: ${upper:${bundle:bench-messages:app.tier}}
      - name: hostLower
        value: ${lower:${env:HOSTNAME:-LOCALHOST}}

      # ${log4j:} — where the configuration itself came from
      - name: configLocation
        value: ${log4j:configLocation}
      - name: configParent
        value: ${log4j:configParentLocation}

      # ${main:} — argv, by index or flag name
      - name: firstArg
        value: ${main:0:-none}

      # ${docker:} — only inside a container with the Docker API reachable
      - name: containerId
        value: ${docker:containerId:-not-in-docker}

      # ${jndi:} — OFF by default since 2.17.0. Left unresolved on purpose;
      # enabling it is what CVE-2021-44228 abused.
      - name: jndiValue
        value: "${jndi:java:comp/env/benchName}"

      # ${spring:} — needs a Spring Environment; see the Spring Boot apps
      - name: springProfile
        value: ${spring:spring.profiles.active:-no-spring}

  Appenders:
    # A file name built from config-time lookups: resolved once, which is
    # exactly right for a path.
    File:
      - name: Resolved
        fileName: ${dir}/${startDate}-${appTier}.log
        append: false
        PatternLayout:
          pattern: "%d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n"

      # Event-time lookups. The doubled $ defers them; with a single $ they
      # would resolve once against the context the configuration was built in,
      # which for MDC means empty forever.
      - name: PerEvent
        fileName: ${dir}/per-event.log
        append: false
        PatternLayout:
          pattern: "%d{HH:mm:ss.SSS} %-5level ctx=$${ctx:traceId:-none} map=$${map:event:-none} marker=$${marker:name:-none} sd=$${sd:type:-none} event=$${event:Level} - %msg%n"

    # Config-time values printed once as a header, so a run records exactly what
    # each lookup produced on this machine.
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n"
        header: "== config-time lookups ==============================%n  app          ${appName} (${appTier} / ${tierUpper})%n  java         ${javaVersion} ${javaVm}%n  runtime      ${javaRuntime}%n  os           ${javaOs}%n  hw           ${javaHw}%n  locale       ${javaLocale}%n  user         ${userName}%n  home         ${home}%n  BENCH_ENV    ${benchEnv}%n  host(lower)  ${hostLower}%n  date         ${startDate}%n  config       ${configLocation}%n  config dir   ${configParent}%n  argv[0]      ${firstArg}%n  docker       ${containerId}%n  jndi         ${jndiValue}%n  spring       ${springProfile}%n=====================================================%n"

  Loggers:
    Logger:
      name: org.apache.logging.bench
      level: TRACE
    Root:
      level: INFO
      AppenderRef:
        - ref: Console
        - ref: Resolved
        - ref: PerEvent
