# Async infrastructure, in YAML.
# Mirrors configs/xml/async-queues.xml. Feature matrix §8, §11.
#
# Two separate mechanisms share the word "async":
#   AsyncLogger / AsyncRoot  the LMAX Disruptor, one ring buffer for the whole
#                            context, chosen per logger. The caller hands off
#                            before the layout runs.
#   AsyncAppender            a queue in front of ONE appender. The caller still
#                            does the LoggerConfig work; only the append defers.
#
# An AsyncLogger whose appender is an AsyncAppender hands off twice, so the
# event crosses two thread boundaries and its ordering relative to other loggers
# stops being meaningful. That arrangement is deliberate below.
#
# The queue implementations belong to the AsyncAppender; AsyncLogger always uses
# the Disruptor ring buffer. Three of the four need a third-party jar, and a
# missing one is not fatal — Log4j falls back to ArrayBlockingQueue and says so
# only at DEBUG, so a config that looks like it uses JCTools may not.

Configuration:
  status: WARN
  name: async-queues

  Properties:
    Property:
      - name: dir
        value: ${sys:bench.log.dir:-logs}/async
      - name: pattern
        value: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{1.} - %msg%n"

  # How the Disruptor's consumer thread waits for work — the biggest
  # latency/CPU trade-off in async logging, and context-wide.
  #   Block (default) park on a lock: lowest CPU, highest latency
  #   Timeout         block with a timeout, then re-check
  #   Yield / Sleep   spin first; burn a core to save microseconds
  #
  # The attribute is `class`, NOT `factoryClassName`: the builder field has the
  # longer name but @PluginBuilderAttribute renames it, and using the field name
  # fails @Required as though the attribute were missing entirely.
  AsyncWaitStrategyFactory:
    class: org.apache.logging.log4j.core.async.DefaultAsyncWaitStrategyFactory

  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: ${pattern}

    # One file per queue, so a run shows which events went through which.
    File:
      - name: ArrayTarget
        fileName: ${dir}/array-blocking-queue.log
        append: false
        PatternLayout:
          pattern: "[array] ${pattern}"
      - name: DisruptorTarget
        fileName: ${dir}/disruptor-blocking-queue.log
        append: false
        PatternLayout:
          pattern: "[disruptor] ${pattern}"
      - name: JcToolsTarget
        fileName: ${dir}/jctools-blocking-queue.log
        append: false
        PatternLayout:
          pattern: "[jctools] ${pattern}"
      - name: TransferTarget
        fileName: ${dir}/linked-transfer-queue.log
        append: false
        PatternLayout:
          pattern: "[transfer] ${pattern}"
      - name: SyncTarget
        fileName: ${dir}/sync.log
        append: false
        PatternLayout:
          pattern: "[sync] ${pattern}"

    Async:
      # ══ ArrayBlockingQueue — the default ══
      # bufferSize is in EVENTS. blocking=true makes a full queue apply
      # back-pressure to the caller; false discards under AsyncQueueFullPolicy.
      # shutdownTimeout matters: the default 0 means "wait forever to drain", so
      # a wedged appender hangs JVM shutdown rather than losing events.
      - name: AsyncArray
        bufferSize: 512
        blocking: true
        shutdownTimeout: 2000
        AppenderRef:
          ref: ArrayTarget
        ArrayBlockingQueue: {}

      # ══ DisruptorBlockingQueue — needs com.conversantmedia:disruptor ══
      - name: AsyncDisruptor
        bufferSize: 512
        blocking: true
        shutdownTimeout: 2000
        AppenderRef:
          ref: DisruptorTarget
        DisruptorBlockingQueue:
          spinPolicy: WAITING

      # ══ JCToolsBlockingQueue — needs org.jctools:jctools-core ══
      - name: AsyncJcTools
        bufferSize: 512
        blocking: true
        shutdownTimeout: 2000
        AppenderRef:
          ref: JcToolsTarget
        JCToolsBlockingQueue:
          waitStrategy: PARK

      # ══ LinkedTransferQueue — unbounded ══
      # bufferSize is therefore ignored, so back-pressure is impossible: a slow
      # appender grows the queue until the heap is gone instead of slowing the
      # application down.
      - name: AsyncTransfer
        bufferSize: 512
        blocking: true
        shutdownTimeout: 2000
        AppenderRef:
          ref: TransferTarget
        LinkedTransferQueue: {}

  Loggers:
    # ══ AsyncLogger — the Disruptor path ══
    # includeLocation=false is the default and the reason async logging is fast:
    # capturing location walks the stack at call time, on the caller's thread.
    # It is true here only so %l does not render as "?" and look like a bug.
    # This logger's appenders are themselves AsyncAppenders: two hand-offs.
    AsyncLogger:
      name: org.apache.logging.bench.scenario.MessageScenario
      level: TRACE
      includeLocation: true
      additivity: false
      AppenderRef:
        - ref: AsyncArray
        - ref: AsyncDisruptor

    # Mixed: a plain synchronous logger alongside the async ones in the same
    # configuration — the arrangement most applications actually have, and where
    # ordering surprises appear.
    Logger:
      name: org.apache.logging.bench
      level: TRACE
      additivity: false
      AppenderRef:
        - ref: Console
        - ref: SyncTarget
        - ref: AsyncJcTools
        - ref: AsyncTransfer

    Root:
      level: INFO
      AppenderRef:
        ref: Console
