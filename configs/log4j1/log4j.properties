# Log4j 1.x properties format, consumed through the log4j-1.2-api bridge.
# Feature matrix §11, §12 — Log4j1PropertiesConfigurationFactory.
#
# This is NOT the Log4j 2 properties format. The two are mutually incompatible
# despite both being .properties; compare configs/properties/baseline-console.properties.
#
# To make Log4j 2 read this file rather than reject it, the bridge's factory must
# be selected explicitly:
#
#   -Dlog4j1.compatibility=true
#   -Dlog4j.configuration=configs/log4j1/log4j.properties
#
# Note the 1.x system property is log4j.configuration (no "File" suffix) and
# takes a resource name or URL. Setting only the Log4j 2 property will not work.

log4j.rootLogger=INFO, CONSOLE, FILE

# ── ConsoleAppender + PatternLayout ──────────────────────────────────────────
# 1.x conversion characters differ from 2.x: %p not %level, and there is no %n
# equivalent for markers or MDC-as-a-map.
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{1} - %m%n

# ── RollingFileAppender ──────────────────────────────────────────────────────
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=logs/log4j1/app.log
log4j.appender.FILE.MaxFileSize=64KB
log4j.appender.FILE.MaxBackupIndex=5
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %C{1}.%M(%L) - %m%n

# ── TTCCLayout: the 1.x-only layout, kept to prove the bridge maps it ────────
log4j.appender.TTCC=org.apache.log4j.ConsoleAppender
log4j.appender.TTCC.layout=org.apache.log4j.TTCCLayout
log4j.appender.TTCC.layout.DateFormat=ISO8601
log4j.appender.TTCC.layout.ThreadPrinting=true
log4j.appender.TTCC.layout.CategoryPrefixing=true
log4j.appender.TTCC.layout.ContextPrinting=true

# ── Per-category levels. "Category" is the 1.x name for a logger. ────────────
log4j.logger.org.apache.logging.bench=TRACE
log4j.logger.org.apache.logging.bench.noisy=WARN, CONSOLE
log4j.additivity.org.apache.logging.bench.noisy=false
