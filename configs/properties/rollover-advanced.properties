# The rest of the rollover vocabulary, in the properties format.
# Mirrors configs/xml/rollover-advanced.xml. Feature matrix §6, §11.
#
# rollover-full covers the policies and strategies; this covers what happens
# AFTER a roll — which files survive, and what permissions they end up with.
#
# The Groovy body below is one logical line with \n escapes, because a
# properties value cannot span lines. java.util.Properties turns those into real
# newlines before Log4j ever sees the script, so Groovy receives ordinary
# multi-line source.

status = WARN
name = rollover-advanced

property.dir = ${sys:bench.log.dir:-logs}/rollover-advanced
property.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# ── IfAll + IfNot + SortByModificationTime ───────────────────────────────────
# IfAll requires every nested condition; IfAny any one. IfNot inverts what it
# wraps. Read it as: delete app-*.log.gz that are NOT newer than a minute, once
# more than 4 have accumulated.
#
# The sorter's attribute is `recentFirst` — not `ascending`, which is rejected
# as invalid while the sorter still builds with its default.
# IfAccumulatedFileCount deletes everything past the threshold in sorted order,
# so recentFirst=true (the default, and what is wanted) leaves the oldest past
# the cut; false keeps the four oldest and deletes everything recent.
appender.conditions.type = RollingFile
appender.conditions.name = Conditions
appender.conditions.fileName = ${dir}/conditions/app.log
appender.conditions.filePattern = ${dir}/conditions/app-%i.log.gz
appender.conditions.layout.type = PatternLayout
appender.conditions.layout.pattern = ${pattern}
appender.conditions.policy.type = SizeBasedTriggeringPolicy
appender.conditions.policy.size = 8KB
appender.conditions.strategy.type = DefaultRolloverStrategy
appender.conditions.strategy.max = 20
appender.conditions.strategy.delete.type = Delete
appender.conditions.strategy.delete.basePath = ${dir}/conditions
appender.conditions.strategy.delete.maxDepth = 1
# IfAll is nested INSIDE IfFileName, which is load-bearing here and is also the
# only formulation this format can express correctly.
#
# Delete's sibling conditions are evaluated in order and IfAccumulatedFileCount
# is STATEFUL — it counts every file it is asked about. As siblings, a counter
# ahead of the glob also counts the active app.log, and the identical policy
# keeps 3 files instead of 4. This format cannot control that order at all:
# java.util.Properties is a Hashtable, so sibling components are added in hash
# order rather than file order, and the flat form built IfAll first regardless
# of where it appeared in the file. Nesting makes the order irrelevant.
appender.conditions.strategy.delete.ifFileName.type = IfFileName
appender.conditions.strategy.delete.ifFileName.glob = app-*.log.gz
appender.conditions.strategy.delete.ifFileName.ifAll.type = IfAll
# Never touch anything written in the last minute, however many accumulate.
appender.conditions.strategy.delete.ifFileName.ifAll.ifNot.type = IfNot
appender.conditions.strategy.delete.ifFileName.ifAll.ifNot.ifAge.type = IfLastModified
appender.conditions.strategy.delete.ifFileName.ifAll.ifNot.ifAge.age = PT1M
appender.conditions.strategy.delete.ifFileName.ifAll.ifCount.type = IfAccumulatedFileCount
appender.conditions.strategy.delete.ifFileName.ifAll.ifCount.exceeds = 4
appender.conditions.strategy.delete.sorter.type = SortByModificationTime
appender.conditions.strategy.delete.sorter.recentFirst = true

# ── ScriptCondition ──────────────────────────────────────────────────────────
# Arbitrary logic over the candidate list. The script receives `pathList` and
# returns the files to actually delete — returning the list it was given deletes
# everything, so the empty list is the safe default. Needs
# log4j2.Script.enableLanguages, which ./bench passes; without it the condition
# is dropped and nothing is deleted, which fails safe.
appender.scripted.type = RollingFile
appender.scripted.name = Scripted
appender.scripted.fileName = ${dir}/scripted/app.log
appender.scripted.filePattern = ${dir}/scripted/app-%i.log.gz
appender.scripted.layout.type = PatternLayout
appender.scripted.layout.pattern = ${pattern}
appender.scripted.policy.type = SizeBasedTriggeringPolicy
appender.scripted.policy.size = 8KB
appender.scripted.strategy.type = DefaultRolloverStrategy
appender.scripted.strategy.max = 20
appender.scripted.strategy.delete.type = Delete
appender.scripted.strategy.delete.basePath = ${dir}/scripted
appender.scripted.strategy.delete.maxDepth = 1
appender.scripted.strategy.delete.condition.type = ScriptCondition
appender.scripted.strategy.delete.condition.script.type = Script
appender.scripted.strategy.delete.condition.script.name = KeepNewestThree
appender.scripted.strategy.delete.condition.script.language = groovy
appender.scripted.strategy.delete.condition.script.scriptText = def sorted = pathList.sort { -it.attributes.lastModifiedTime().toMillis() }\ndef doomed = sorted.size() > 3 ? sorted[3..-1] : []\nstatusLogger.debug("ScriptCondition: {} candidates, deleting {}", sorted.size(), doomed.size())\ndoomed

# ── PosixViewAttribute ───────────────────────────────────────────────────────
# Sets POSIX permissions on the files it matches after a roll, because a rolled
# file is created with the process umask — so a directory that is group-readable
# by policy silently stops being so once it rolls.
#
# fileOwner and fileGroup are omitted deliberately: setting them needs
# privileges the bench does not have, and the action fails the whole rollover
# rather than skipping the attribute it cannot set.
appender.posix.type = RollingFile
appender.posix.name = Posix
appender.posix.fileName = ${dir}/posix/app.log
appender.posix.filePattern = ${dir}/posix/app-%i.log.gz
appender.posix.filePermissions = rw-r-----
appender.posix.layout.type = PatternLayout
appender.posix.layout.pattern = ${pattern}
appender.posix.policy.type = SizeBasedTriggeringPolicy
appender.posix.policy.size = 8KB
appender.posix.strategy.type = DefaultRolloverStrategy
appender.posix.strategy.max = 20
appender.posix.strategy.posix.type = PosixViewAttribute
appender.posix.strategy.posix.basePath = ${dir}/posix
appender.posix.strategy.posix.maxDepth = 1
appender.posix.strategy.posix.followLinks = false
appender.posix.strategy.posix.filePermissions = rw-r-----
appender.posix.strategy.posix.ifFileName.type = IfFileName
appender.posix.strategy.posix.ifFileName.glob = app-*.log.gz

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.conditions.ref = Conditions
rootLogger.appenderRef.scripted.ref = Scripted
rootLogger.appenderRef.posix.ref = Posix
