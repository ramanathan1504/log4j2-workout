# Async infrastructure, in the properties format.
# Mirrors configs/xml/async-queues.xml. Feature matrix §8, §11.
#
# Two separate mechanisms share the word "async":
#   AsyncLogger / AsyncRoot  the LMAX Disruptor, one ring buffer for the whole
#                            context, chosen per logger
#   AsyncAppender            a queue in front of ONE appender
#
# In this format the choice is made by the logger's `type`, which is the only
# place it appears — `logger.<id>.type = asyncLogger` rather than a different
# prefix. Leave the type off and you get a plain synchronous logger with no
# indication that the async one you meant was not created.

status = WARN
name = async-queues

property.dir = ${sys:bench.log.dir:-logs}/async
property.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{1.} - %msg%n

# How the Disruptor's consumer thread waits for work — the biggest latency/CPU
# trade-off in async logging, and context-wide.
#   Block (default) park on a lock: lowest CPU, highest latency
#   Timeout         block with a timeout, then re-check
#   Yield / Sleep   spin first; burn a core to save microseconds
#
# The attribute is `class`, NOT `factoryClassName`: the builder field has the
# longer name but @PluginBuilderAttribute renames it, and using the field name
# fails @Required as though the attribute were missing entirely.
AsyncWaitStrategyFactory.type = AsyncWaitStrategyFactory
AsyncWaitStrategyFactory.class = org.apache.logging.log4j.core.async.DefaultAsyncWaitStrategyFactory

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# One file per queue, so a run shows which events went through which.
appender.arraytarget.type = File
appender.arraytarget.name = ArrayTarget
appender.arraytarget.fileName = ${dir}/array-blocking-queue.log
appender.arraytarget.append = false
appender.arraytarget.layout.type = PatternLayout
appender.arraytarget.layout.pattern = [array] ${pattern}

appender.disruptortarget.type = File
appender.disruptortarget.name = DisruptorTarget
appender.disruptortarget.fileName = ${dir}/disruptor-blocking-queue.log
appender.disruptortarget.append = false
appender.disruptortarget.layout.type = PatternLayout
appender.disruptortarget.layout.pattern = [disruptor] ${pattern}

appender.jctoolstarget.type = File
appender.jctoolstarget.name = JcToolsTarget
appender.jctoolstarget.fileName = ${dir}/jctools-blocking-queue.log
appender.jctoolstarget.append = false
appender.jctoolstarget.layout.type = PatternLayout
appender.jctoolstarget.layout.pattern = [jctools] ${pattern}

appender.transfertarget.type = File
appender.transfertarget.name = TransferTarget
appender.transfertarget.fileName = ${dir}/linked-transfer-queue.log
appender.transfertarget.append = false
appender.transfertarget.layout.type = PatternLayout
appender.transfertarget.layout.pattern = [transfer] ${pattern}

appender.synctarget.type = File
appender.synctarget.name = SyncTarget
appender.synctarget.fileName = ${dir}/sync.log
appender.synctarget.append = false
appender.synctarget.layout.type = PatternLayout
appender.synctarget.layout.pattern = [sync] ${pattern}

# ── ArrayBlockingQueue — the default ─────────────────────────────────────────
# bufferSize is in EVENTS. blocking=true makes a full queue apply back-pressure
# to the caller; false discards under AsyncQueueFullPolicy. shutdownTimeout
# matters: the default 0 means "wait forever to drain", so a wedged appender
# hangs JVM shutdown rather than losing events.
appender.asyncarray.type = Async
appender.asyncarray.name = AsyncArray
appender.asyncarray.bufferSize = 512
appender.asyncarray.blocking = true
appender.asyncarray.shutdownTimeout = 2000
appender.asyncarray.target.type = AppenderRef
appender.asyncarray.target.ref = ArrayTarget
appender.asyncarray.queue.type = ArrayBlockingQueue

# ── DisruptorBlockingQueue — needs com.conversantmedia:disruptor ─────────────
appender.asyncdisruptor.type = Async
appender.asyncdisruptor.name = AsyncDisruptor
appender.asyncdisruptor.bufferSize = 512
appender.asyncdisruptor.blocking = true
appender.asyncdisruptor.shutdownTimeout = 2000
appender.asyncdisruptor.target.type = AppenderRef
appender.asyncdisruptor.target.ref = DisruptorTarget
appender.asyncdisruptor.queue.type = DisruptorBlockingQueue
appender.asyncdisruptor.queue.spinPolicy = WAITING

# ── JCToolsBlockingQueue — needs org.jctools:jctools-core ────────────────────
appender.asyncjctools.type = Async
appender.asyncjctools.name = AsyncJcTools
appender.asyncjctools.bufferSize = 512
appender.asyncjctools.blocking = true
appender.asyncjctools.shutdownTimeout = 2000
appender.asyncjctools.target.type = AppenderRef
appender.asyncjctools.target.ref = JcToolsTarget
appender.asyncjctools.queue.type = JCToolsBlockingQueue
appender.asyncjctools.queue.waitStrategy = PARK

# ── LinkedTransferQueue — unbounded ──────────────────────────────────────────
# bufferSize is therefore ignored, so back-pressure is impossible: a slow
# appender grows the queue until the heap is gone.
appender.asynctransfer.type = Async
appender.asynctransfer.name = AsyncTransfer
appender.asynctransfer.bufferSize = 512
appender.asynctransfer.blocking = true
appender.asynctransfer.shutdownTimeout = 2000
appender.asynctransfer.target.type = AppenderRef
appender.asynctransfer.target.ref = TransferTarget
appender.asynctransfer.queue.type = LinkedTransferQueue

# ── AsyncLogger — the Disruptor path ─────────────────────────────────────────
# includeLocation=false is the default and the reason async logging is fast:
# capturing location walks the stack at call time, on the caller's thread. True
# here only so %l does not render as "?" and look like a bug. This logger's
# appenders are themselves AsyncAppenders: two hand-offs, two thread boundaries.
logger.async.type = asyncLogger
logger.async.name = org.apache.logging.bench.scenario.MessageScenario
logger.async.level = TRACE
logger.async.includeLocation = true
logger.async.additivity = false
logger.async.appenderRef.array.ref = AsyncArray
logger.async.appenderRef.disruptor.ref = AsyncDisruptor

# Mixed: a plain synchronous logger alongside the async ones in the same
# configuration — the arrangement most applications actually have.
logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE
logger.bench.additivity = false
logger.bench.appenderRef.console.ref = Console
logger.bench.appenderRef.sync.ref = SyncTarget
logger.bench.appenderRef.jctools.ref = AsyncJcTools
logger.bench.appenderRef.transfer.ref = AsyncTransfer

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
