# The appenders that wrap other appenders, in the properties format.
# Mirrors configs/xml/appender-composite.xml. Feature matrix §1, §7, §11.
#
# ── THIS CONFIG EMITS STATUS-LOGGER ERRORS ON PURPOSE ────────────────────────
#
# Failover cannot be demonstrated without a primary that fails, and a failing
# appender reports itself. Expect three errors naming BrokenPrimary. Judge a run
# by whether logs/composite/failover.log filled up; errors that do NOT name
# BrokenPrimary are the ones worth reading.

status = WARN
name = appender-composite

property.dir = ${sys:bench.log.dir:-logs}/composite
property.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} %notEmpty{[%marker] }- %msg%n

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# ── A primary that constructs cleanly and fails on write ─────────────────────
# It cannot be a File appender: FileManager creates the parent directory while
# the manager is built, so a bad path fails at construction and Failover reports
# "Unable to locate primary" instead of failing over. A TCP socket to a closed
# local port constructs, then fails every append. Port 9 is discard.
appender.broken.type = Socket
appender.broken.name = BrokenPrimary
appender.broken.host = 127.0.0.1
appender.broken.port = 9
appender.broken.protocol = TCP
appender.broken.reconnectionDelayMillis = 600000
appender.broken.immediateFail = true
appender.broken.ignoreExceptions = false
appender.broken.layout.type = PatternLayout
appender.broken.layout.pattern = ${pattern}

appender.failovertarget.type = File
appender.failovertarget.name = FailoverTarget
appender.failovertarget.fileName = ${dir}/failover.log
appender.failovertarget.append = false
appender.failovertarget.layout.type = PatternLayout
appender.failovertarget.layout.pattern = [failover] ${pattern}

appender.rewritetarget.type = File
appender.rewritetarget.name = RewriteTarget
appender.rewritetarget.fileName = ${dir}/rewrite.log
appender.rewritetarget.append = false
# %K renders the MapMessage, %X the context data, so both rewrite targets show.
appender.rewritetarget.layout.type = PatternLayout
appender.rewritetarget.layout.pattern = [rewrite] %-5level %K %X - %msg%n

# ── Failover ─────────────────────────────────────────────────────────────────
# retryIntervalSeconds leaves the primary alone after a failure, so a flapping
# destination does not cost a failed write per event.
appender.failover.type = Failover
appender.failover.name = Failover
appender.failover.primary = BrokenPrimary
appender.failover.retryIntervalSeconds = 600
appender.failover.failovers.type = Failovers
appender.failover.failovers.target.type = AppenderRef
appender.failover.failovers.target.ref = FailoverTarget

# ── Routing ──────────────────────────────────────────────────────────────────
# Routed on userId, because that is a key the `context` scenario actually sets.
# The doubled $ defers evaluation to each event; a single $ would resolve once
# at configuration time and every event would share one route.
appender.routing.type = Routing
appender.routing.name = Routing
appender.routing.routes.type = Routes
appender.routing.routes.pattern = $${ctx:userId}
appender.routing.routes.alice.type = Route
appender.routing.routes.alice.key = alice
appender.routing.routes.alice.file.type = File
appender.routing.routes.alice.file.name = RouteAlice
appender.routing.routes.alice.file.fileName = ${dir}/user-alice.log
appender.routing.routes.alice.file.append = false
appender.routing.routes.alice.file.layout.type = PatternLayout
appender.routing.routes.alice.file.layout.pattern = [route:alice] ${pattern}
# Default route: no key. Omit it and events matching nothing are dropped.
appender.routing.routes.other.type = Route
appender.routing.routes.other.file.type = File
appender.routing.routes.other.file.name = RouteOther-${ctx:userId:-anonymous}
appender.routing.routes.other.file.fileName = ${dir}/user-${ctx:userId:-anonymous}.log
appender.routing.routes.other.file.append = false
appender.routing.routes.other.file.layout.type = PatternLayout
appender.routing.routes.other.file.layout.pattern = [route:default] ${pattern}
appender.routing.purge.type = IdlePurgePolicy
appender.routing.purge.timeToLive = 15
appender.routing.purge.timeUnit = MINUTES

# ── Rewrite ──────────────────────────────────────────────────────────────────
# Only one policy per Rewrite appender, so each gets its own.

# Add merges into a MapMessage; Update only replaces existing keys. Events that
# are not MapMessages pass through untouched, which is the usual surprise.
appender.rewritemap.type = Rewrite
appender.rewritemap.name = RewriteMap
appender.rewritemap.target.type = AppenderRef
appender.rewritemap.target.ref = RewriteTarget
appender.rewritemap.policy.type = MapRewritePolicy
appender.rewritemap.policy.mode = Add
appender.rewritemap.policy.env.type = KeyValuePair
appender.rewritemap.policy.env.key = environment
appender.rewritemap.policy.env.value = bench
appender.rewritemap.policy.flag.type = KeyValuePair
appender.rewritemap.policy.flag.key = rewritten
appender.rewritemap.policy.flag.value = true

# Adds to the event's context data (MDC), not to the message.
appender.rewriteprops.type = Rewrite
appender.rewriteprops.name = RewriteProperties
appender.rewriteprops.target.type = AppenderRef
appender.rewriteprops.target.ref = RewriteTarget
appender.rewriteprops.policy.type = PropertiesRewritePolicy
appender.rewriteprops.policy.host.type = Property
appender.rewriteprops.policy.host.name = hostname
appender.rewriteprops.policy.host.value = ${hostName}
appender.rewriteprops.policy.ver.type = Property
appender.rewriteprops.policy.ver.name = pid
appender.rewriteprops.policy.ver.value = ${sys:java.version}

# Demotes or promotes levels for one logger prefix.
appender.rewritelevel.type = Rewrite
appender.rewritelevel.name = RewriteLevel
appender.rewritelevel.target.type = AppenderRef
appender.rewritelevel.target.ref = RewriteTarget
appender.rewritelevel.policy.type = LoggerNameLevelRewritePolicy
appender.rewritelevel.policy.logger = org.apache.logging.bench
appender.rewritelevel.policy.info.type = KeyValuePair
appender.rewritelevel.policy.info.key = INFO
appender.rewritelevel.policy.info.value = DEBUG
appender.rewritelevel.policy.warn.type = KeyValuePair
appender.rewritelevel.policy.warn.key = WARN
appender.rewritelevel.policy.warn.value = INFO

# ── AppenderSet + ScriptAppenderSelector ─────────────────────────────────────
# The script runs ONCE, at configuration time, and names one appender in the
# set; the choice is then fixed. Needs a JSR-223 engine AND
# log4j2.Script.enableLanguages, which ./bench passes.
appender.selected.type = ScriptAppenderSelector
appender.selected.name = Selected
appender.selected.script.type = Script
appender.selected.script.name = ChooseAppender
appender.selected.script.language = groovy
appender.selected.script.scriptText = System.getProperty("bench.appender", "SetAlpha")
appender.selected.set.type = AppenderSet
appender.selected.set.alpha.type = File
appender.selected.set.alpha.name = SetAlpha
appender.selected.set.alpha.fileName = ${dir}/set-alpha.log
appender.selected.set.alpha.append = false
appender.selected.set.alpha.layout.type = PatternLayout
appender.selected.set.alpha.layout.pattern = [set:alpha] ${pattern}
appender.selected.set.beta.type = File
appender.selected.set.beta.name = SetBeta
appender.selected.set.beta.fileName = ${dir}/set-beta.log
appender.selected.set.beta.append = false
appender.selected.set.beta.layout.type = PatternLayout
appender.selected.set.beta.layout.pattern = [set:beta] ${pattern}

# ── Async ────────────────────────────────────────────────────────────────────
appender.async.type = Async
appender.async.name = Async
appender.async.bufferSize = 256
appender.async.blocking = true
appender.async.routing.type = AppenderRef
appender.async.routing.ref = Routing
appender.async.failover.type = AppenderRef
appender.async.failover.ref = Failover

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.async.ref = Async
rootLogger.appenderRef.rewritemap.ref = RewriteMap
rootLogger.appenderRef.rewriteprops.ref = RewriteProperties
rootLogger.appenderRef.rewritelevel.ref = RewriteLevel
rootLogger.appenderRef.selected.ref = Selected
