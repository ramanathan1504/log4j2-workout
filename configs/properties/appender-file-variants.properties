# The non-rolling file appenders and the File options that change how bytes
# reach the disk. Feature matrix §1, §11.
#
# Four appenders that all "write to a file" and differ in where the bytes sit
# between the log call and the disk — which decides how much is lost when the
# process is killed:
#
#   File                a BufferedOutputStream; immediateFlush=true (default)
#                       pushes every event to the OS
#   RandomAccessFile    a ByteBuffer flushed to the channel — same durability,
#                       cheaper copy
#   MemoryMappedFile    an mmap region; no write syscall at all, so a KILLED
#                       PROCESS loses nothing but a crashed MACHINE can lose the
#                       tail
#   File, buffered      immediateFlush=false: fast, tail lost if the JVM dies
#
# Durability differs, output does not — a bug here shows up as missing events
# after a crash rather than as wrong output.

status = WARN
name = appender-file-variants

property.dir = ${sys:bench.log.dir:-logs}/file-variants
property.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# ── File, flushed per event — the safe default ───────────────────────────────
# filePermissions is applied at creation, so unlike PosixViewAttribute it needs
# no post-rollover action. POSIX only; ignored on Windows.
appender.plain.type = File
appender.plain.name = Plain
appender.plain.fileName = ${dir}/plain.log
appender.plain.append = false
appender.plain.immediateFlush = true
appender.plain.filePermissions = rw-r-----
appender.plain.layout.type = PatternLayout
appender.plain.layout.pattern = [plain] ${pattern}

# ── File, buffered ───────────────────────────────────────────────────────────
# The buffer is flushed on a clean shutdown, so events only vanish if the JVM
# dies without running its hooks — the setting that tests fine and loses data in
# production.
appender.buffered.type = File
appender.buffered.name = Buffered
appender.buffered.fileName = ${dir}/buffered.log
appender.buffered.append = false
appender.buffered.immediateFlush = false
appender.buffered.bufferedIO = true
appender.buffered.bufferSize = 16384
appender.buffered.layout.type = PatternLayout
appender.buffered.layout.pattern = [buffered] ${pattern}

# ── File, created on demand ──────────────────────────────────────────────────
# Not opened until the first event, so a bad path is not discovered at startup —
# it fails at the first event instead, which is what appender-composite relies
# on for its failover primary.
appender.ondemand.type = File
appender.ondemand.name = OnDemand
appender.ondemand.fileName = ${dir}/on-demand.log
appender.ondemand.append = false
appender.ondemand.createOnDemand = true
appender.ondemand.layout.type = PatternLayout
appender.ondemand.layout.pattern = [on-demand] ${pattern}

# ── RandomAccessFile ─────────────────────────────────────────────────────────
# ByteBuffer-backed. bufferSize is in BYTES here, not events.
appender.randomaccess.type = RandomAccessFile
appender.randomaccess.name = RandomAccess
appender.randomaccess.fileName = ${dir}/random-access.log
appender.randomaccess.append = false
appender.randomaccess.immediateFlush = true
appender.randomaccess.layout.type = PatternLayout
appender.randomaccess.layout.pattern = [random-access] ${pattern}

# ── MemoryMappedFile ─────────────────────────────────────────────────────────
# regionLength is the mmap window and the file is pre-extended to it, so this
# appender's file appears at its full region size on disk immediately — mostly
# zero bytes — and is truncated back only on a clean close. Must be a power of
# two; Log4j rounds up silently otherwise.
appender.mmap.type = MemoryMappedFile
appender.mmap.name = MemoryMapped
appender.mmap.fileName = ${dir}/memory-mapped.log
appender.mmap.append = false
appender.mmap.regionLength = 65536
appender.mmap.immediateFlush = false
appender.mmap.layout.type = PatternLayout
appender.mmap.layout.pattern = [memory-mapped] ${pattern}

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.plain.ref = Plain
rootLogger.appenderRef.buffered.ref = Buffered
rootLogger.appenderRef.ondemand.ref = OnDemand
rootLogger.appenderRef.randomaccess.ref = RandomAccess
rootLogger.appenderRef.mmap.ref = MemoryMapped
