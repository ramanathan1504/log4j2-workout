# The layouts not covered by the other configs, in the properties format.
# Mirrors configs/xml/layout-remaining.xml. Feature matrix §2, §11.
#
# Each appender writes to its own file: several of these emit one long line per
# event and interleaving them on the console makes each unreadable.

status = WARN
name = layout-remaining

property.dir = ${sys:bench.log.dir:-logs}/layout-remaining

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

# ── GelfLayout ───────────────────────────────────────────────────────────────
# Graylog Extended Log Format: JSON with reserved keys (version, host,
# short_message, timestamp, level) plus underscore-prefixed custom fields.
# compressionType GZIP/ZLIB emits binary — right for a UDP socket, useless for
# reading. GELF levels are syslog severities, so TRACE and DEBUG both become 7.
appender.gelf.type = File
appender.gelf.name = Gelf
appender.gelf.fileName = ${dir}/gelf.json
appender.gelf.append = false
appender.gelf.layout.type = GelfLayout
appender.gelf.layout.host = log4j-bench
appender.gelf.layout.compressionType = OFF
appender.gelf.layout.includeStacktrace = true
appender.gelf.layout.includeThreadContext = true
appender.gelf.layout.includeNullDelimiter = false
appender.gelf.layout.includeNewLineDelimiter = true
appender.gelf.layout.includeMapMessage = true
appender.gelf.layout.env.type = KeyValuePair
appender.gelf.layout.env.key = _environment
appender.gelf.layout.env.value = bench
appender.gelf.layout.svc.type = KeyValuePair
appender.gelf.layout.svc.key = _service
appender.gelf.layout.svc.value = log4j-bench

# ── CsvLogEventLayout ────────────────────────────────────────────────────────
# One row per event, columns fixed by the layout. Needs commons-csv. `format`
# names a CSVFormat preset, and the quoting rules differ enough between presets
# that a consumer written against one mis-parses another.
appender.csvevents.type = File
appender.csvevents.name = CsvEvents
appender.csvevents.fileName = ${dir}/events.csv
appender.csvevents.append = false
appender.csvevents.layout.type = CsvLogEventLayout
appender.csvevents.layout.format = RFC4180
appender.csvevents.layout.delimiter = ,
appender.csvevents.layout.quoteMode = MINIMAL
appender.csvevents.layout.nullString = \\N

# ── CsvParameterLayout ───────────────────────────────────────────────────────
# Despite the name, unrelated to the above: it writes only the message
# PARAMETERS and ignores everything else about the event.
#
# ── IT NPEs ON ANY EVENT WITH NO PARAMETERS ──
# Message.getParameters() is null for SimpleMessage and for the plain
# logger.info("text") form, and toSerializable hands that to
# CSVFormat.printRecord:
#   NullPointerException: Cannot read the array length because "values" is null
#     at CsvParameterLayout.toSerializable(CsvParameterLayout.java:98)
# One per event, forever. Hence its own logger below rather than the root.
appender.csvparams.type = File
appender.csvparams.name = CsvParams
appender.csvparams.fileName = ${dir}/parameters.csv
appender.csvparams.append = false
appender.csvparams.layout.type = CsvParameterLayout
appender.csvparams.layout.format = Default
appender.csvparams.layout.delimiter = ;
appender.csvparams.layout.quoteMode = ALL

# ── Rfc5424Layout ────────────────────────────────────────────────────────────
# Structured syslog. mdcId and sdId must NOT be written as name@enterprise even
# though that is what appears on the wire — Log4j appends the enterprise number
# itself, and an '@' fails the layout with "Structured id name cannot contain an
# '@'". The layout then does not build and the appender falls back to its
# default, which looks like a plain-text log rather than a broken one.
appender.rfc5424.type = File
appender.rfc5424.name = Rfc5424
appender.rfc5424.fileName = ${dir}/rfc5424.log
appender.rfc5424.append = false
appender.rfc5424.layout.type = Rfc5424Layout
appender.rfc5424.layout.facility = LOCAL0
appender.rfc5424.layout.enterpriseNumber = 32473
appender.rfc5424.layout.appName = log4j-bench
appender.rfc5424.layout.messageId = bench
appender.rfc5424.layout.includeMDC = true
appender.rfc5424.layout.mdcId = bench
appender.rfc5424.layout.mdcPrefix = mdc:
appender.rfc5424.layout.newLine = true
appender.rfc5424.layout.fields.type = LoggerFields
appender.rfc5424.layout.fields.sdId = context
appender.rfc5424.layout.fields.enterpriseId = 32473
appender.rfc5424.layout.fields.discardIfAllFieldsAreEmpty = true
# The doubled $ defers these to each event. With the MDC key absent the
# expression renders LITERALLY rather than as an empty string, and
# discardIfAllFieldsAreEmpty does not drop the element either, because an
# unresolved lookup is not an empty value.
appender.rfc5424.layout.fields.trace.type = KeyValuePair
appender.rfc5424.layout.fields.trace.key = trace
appender.rfc5424.layout.fields.trace.value = $${ctx:traceId}
appender.rfc5424.layout.fields.user.type = KeyValuePair
appender.rfc5424.layout.fields.user.key = user
appender.rfc5424.layout.fields.user.value = $${ctx:userId}

# ── SyslogLayout ─────────────────────────────────────────────────────────────
# The older BSD format (RFC 3164): priority, a timestamp with no year, a host,
# free text. No structured data, so MDC is simply absent.
appender.syslog.type = File
appender.syslog.name = Syslog
appender.syslog.fileName = ${dir}/syslog-bsd.log
appender.syslog.append = false
appender.syslog.layout.type = SyslogLayout
appender.syslog.layout.facility = LOCAL0
appender.syslog.layout.newLine = true
appender.syslog.layout.charset = UTF-8

# ── MessageLayout ────────────────────────────────────────────────────────────
# ── CANNOT BE USED WITH A BYTE-ORIENTED APPENDER ──
# MessageLayout.toByteArray() is `return null;`. toSerializable returns the
# Message object, which JMS can use and File/Console/Socket cannot. Attached to
# a File appender it yields one "An exception occurred processing Appender" per
# event and an empty file. Declared to cover the plugin, left unreferenced.
appender.messageonly.type = File
appender.messageonly.name = MessageOnly
appender.messageonly.fileName = ${dir}/message-only.txt
appender.messageonly.append = false
appender.messageonly.layout.type = MessageLayout

# ── EcsLayout — Elastic's, not Log4j's ───────────────────────────────────────
# co.elastic.logging:log4j2-ecs-layout. Worth having because Log4j ALSO ships an
# ECS template for JsonTemplateLayout: the two produce similar but not identical
# documents. Being third-party, it is also the canary for plugin-API breakage.
appender.ecs.type = File
appender.ecs.name = EcsElastic
appender.ecs.fileName = ${dir}/ecs-elastic.json
appender.ecs.append = false
appender.ecs.layout.type = EcsLayout
appender.ecs.layout.serviceName = log4j-bench
appender.ecs.layout.serviceNodeName = bench-node
appender.ecs.layout.eventDataset = log4j-bench.log
appender.ecs.layout.includeMarkers = true
appender.ecs.layout.includeOrigin = true
appender.ecs.layout.stackTraceAsArray = false
appender.ecs.layout.env.type = KeyValuePair
appender.ecs.layout.env.key = service.environment
appender.ecs.layout.env.value = bench

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

# CsvParameterLayout gets its own logger because it NPEs on parameterless
# events. Nothing logs to this name, so the plugin is built and validated
# without a stack trace per event.
logger.csvparams.name = org.apache.logging.bench.csvparams
logger.csvparams.level = TRACE
logger.csvparams.additivity = false
logger.csvparams.appenderRef.csvparams.ref = CsvParams

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.gelf.ref = Gelf
rootLogger.appenderRef.csvevents.ref = CsvEvents
rootLogger.appenderRef.rfc5424.ref = Rfc5424
rootLogger.appenderRef.syslog.ref = Syslog
rootLogger.appenderRef.ecs.ref = EcsElastic
