# Custom levels, in the properties format.
# Mirrors configs/xml/custom-levels.xml. Feature matrix §11.
#
# A custom level is a name bound to an integer, and the integer decides
# everything. The built-in scale it slots into:
#
#   OFF 0 · FATAL 100 · ERROR 200 · WARN 300 · INFO 400 · DEBUG 500 · TRACE 600
#
# Lower is more severe, so intLevel 150 sits between FATAL and ERROR and a
# logger at ERROR will NOT pass it.
#
# `customLevel` is one of the seven prefixes this format understands, so unlike
# arbiters, custom levels are fully expressible here — but NOT as nested
# components. The segment after `customLevel.` IS the level name and the value
# IS the integer:
#
#     customLevel.AUDIT = 150            correct
#     customLevel.audit.name = AUDIT     wrong
#     customLevel.audit.intLevel = 150
#
# The nested spelling every other element in this format uses produces a key of
# "audit.name" whose value is then parsed as an integer, and the resulting
# NumberFormatException escapes configuration entirely:
#
#   java.lang.NumberFormatException: For input string: "AUDIT"
#     at PropertiesConfigurationBuilder.build(PropertiesConfigurationBuilder.java:123)
#
# so the application dies at its first log call rather than logging a
# configuration error. Note also that the level NAME is case-sensitive here in a
# way the rest of the format is not — the key is used verbatim.

status = WARN
name = custom-levels

property.dir = ${sys:bench.log.dir:-logs}/custom-levels
property.pattern = %d{HH:mm:ss.SSS} %-8level %logger{1.} - %msg%n

# Between FATAL (100) and ERROR (200): more severe than an error.
customLevel.AUDIT = 150
# Between WARN (300) and INFO (400): the syslog NOTICE idea.
customLevel.NOTICE = 350
# Between DEBUG (500) and TRACE (600).
customLevel.VERBOSE = 550

# %-8level rather than %-5level: "VERBOSE" is seven characters and would
# otherwise push the columns out.
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# Everything at AUDIT or more severe — which also catches FATAL (100), because
# a threshold is "this severe or more", not "this level only".
appender.audit.type = File
appender.audit.name = AuditFile
appender.audit.fileName = ${dir}/audit.log
appender.audit.append = false
appender.audit.layout.type = PatternLayout
appender.audit.layout.pattern = ${pattern}
appender.audit.filter.threshold.type = ThresholdFilter
appender.audit.filter.threshold.level = AUDIT
appender.audit.filter.threshold.onMatch = ACCEPT
appender.audit.filter.threshold.onMismatch = DENY

# Exactly AUDIT, which is what an audit trail usually wants.
appender.auditonly.type = File
appender.auditonly.name = AuditOnlyFile
appender.auditonly.fileName = ${dir}/audit-only.log
appender.auditonly.append = false
appender.auditonly.layout.type = PatternLayout
appender.auditonly.layout.pattern = ${pattern}
appender.auditonly.filter.match.type = LevelMatchFilter
appender.auditonly.filter.match.level = AUDIT
appender.auditonly.filter.match.onMatch = ACCEPT
appender.auditonly.filter.match.onMismatch = DENY

# A band spanning custom and built-in levels: NOTICE (350) down to VERBOSE
# (550), so it holds NOTICE, INFO, DEBUG and VERBOSE but not WARN or TRACE.
appender.band.type = File
appender.band.name = BandFile
appender.band.fileName = ${dir}/notice-to-verbose.log
appender.band.append = false
appender.band.layout.type = PatternLayout
appender.band.layout.pattern = ${pattern}
appender.band.filter.range.type = LevelRangeFilter
appender.band.filter.range.minLevel = NOTICE
appender.band.filter.range.maxLevel = VERBOSE
appender.band.filter.range.onMatch = ACCEPT
appender.band.filter.range.onMismatch = DENY

# Custom levels work in a pattern selector too — a full stack for AUDIT, one
# line for everything else.
appender.selector.type = File
appender.selector.name = SelectorFile
appender.selector.fileName = ${dir}/by-level.log
appender.selector.append = false
appender.selector.layout.type = PatternLayout
appender.selector.layout.selector.type = LevelPatternSelector
appender.selector.layout.selector.defaultPattern = ${pattern}
appender.selector.layout.selector.audit.type = PatternMatch
appender.selector.layout.selector.audit.key = AUDIT
appender.selector.layout.selector.audit.pattern = %d{ISO8601} AUDIT %logger - %msg %X%n%xEx{5}
appender.selector.layout.selector.verbose.type = PatternMatch
appender.selector.layout.selector.verbose.key = VERBOSE
appender.selector.layout.selector.verbose.pattern = %d{HH:mm:ss.SSS} verbose %logger{1.} - %msg%n

# A logger set to a custom level. VERBOSE is 550, so this passes everything down
# to VERBOSE but stops TRACE (600).
logger.bench.name = org.apache.logging.bench
logger.bench.level = VERBOSE
logger.bench.additivity = false
logger.bench.appenderRef.console.ref = Console
logger.bench.appenderRef.audit.ref = AuditFile
logger.bench.appenderRef.auditonly.ref = AuditOnlyFile
logger.bench.appenderRef.band.ref = BandFile
logger.bench.appenderRef.selector.ref = SelectorFile

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
