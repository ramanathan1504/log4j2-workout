# Rollover: every triggering policy, both strategies, compression and the full
# Delete vocabulary, in the properties format.
# Mirrors configs/xml/rollover-full.xml. Feature matrix §6, §11.
#
# Thresholds are deliberately tiny so a short run produces many rollovers. Do
# not copy these numbers into anything real.
#
# The nesting keywords are fixed by the appender plugin's parameter names, not
# by the plugin type names:
#
#   appender.<id>.policies.*   →  the Policies composite (several triggers)
#   appender.<id>.policy.*     →  a single triggering policy, no composite
#   appender.<id>.strategy.*   →  the rollover strategy
#
# Below the strategy, ordinary component nesting resumes, so the Delete action's
# condition tree is spelled out with one prefix level per element.

status = WARN
name = rollover-full

property.dir = ${sys:bench.log.dir:-logs}/rollover
property.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

# ── Size + time + onStartup, default strategy, gzip ──────────────────────────
appender.composite.type = RollingFile
appender.composite.name = Composite
appender.composite.fileName = ${dir}/composite/app.log
appender.composite.filePattern = ${dir}/composite/app-%d{yyyy-MM-dd-HH-mm}-%i.log.gz
appender.composite.layout.type = PatternLayout
appender.composite.layout.pattern = ${pattern}
appender.composite.policies.type = Policies
appender.composite.policies.startup.type = OnStartupTriggeringPolicy
appender.composite.policies.startup.minSize = 1
appender.composite.policies.time.type = TimeBasedTriggeringPolicy
appender.composite.policies.time.interval = 1
appender.composite.policies.time.modulate = true
appender.composite.policies.size.type = SizeBasedTriggeringPolicy
appender.composite.policies.size.size = 20KB
# compressionLevel is 0-9 and applies to zip only. maxCompressionDelaySeconds is
# NOT an attribute of this strategy — it exists in neither the 2.x nor the 3.x
# source, and setting it only logs an invalid-attribute error.
appender.composite.strategy.type = DefaultRolloverStrategy
appender.composite.strategy.max = 20
appender.composite.strategy.compressionLevel = 9
appender.composite.strategy.delete.type = Delete
appender.composite.strategy.delete.basePath = ${dir}/composite
appender.composite.strategy.delete.maxDepth = 2
appender.composite.strategy.delete.ifFileName.type = IfFileName
appender.composite.strategy.delete.ifFileName.glob = app-*.log.gz
appender.composite.strategy.delete.ifFileName.ifAny.type = IfAny
appender.composite.strategy.delete.ifFileName.ifAny.ifCount.type = IfAccumulatedFileCount
appender.composite.strategy.delete.ifFileName.ifAny.ifCount.exceeds = 15
appender.composite.strategy.delete.ifFileName.ifAny.ifSize.type = IfAccumulatedFileSize
appender.composite.strategy.delete.ifFileName.ifAny.ifSize.exceeds = 5 MB
appender.composite.strategy.delete.ifFileName.ifAny.ifAge.type = IfLastModified
appender.composite.strategy.delete.ifFileName.ifAny.ifAge.age = P7D

# ── Cron-triggered: every 30 seconds ─────────────────────────────────────────
# A single policy, so `policy` rather than `policies` — no composite involved.
appender.cron.type = RollingFile
appender.cron.name = Cron
appender.cron.fileName = ${dir}/cron/app.log
appender.cron.filePattern = ${dir}/cron/app-%d{yyyy-MM-dd-HH-mm-ss}.log.gz
appender.cron.layout.type = PatternLayout
appender.cron.layout.pattern = ${pattern}
appender.cron.policy.type = CronTriggeringPolicy
appender.cron.policy.schedule = 0/30 * * * * ?
appender.cron.policy.evaluateOnStartup = true
appender.cron.strategy.type = DefaultRolloverStrategy
appender.cron.strategy.max = 10

# ── Direct write: no active "app.log", events go straight to the rolled name ─
appender.direct.type = RollingFile
appender.direct.name = DirectWrite
appender.direct.filePattern = ${dir}/direct/app-%d{yyyy-MM-dd-HH-mm}-%i.log.gz
appender.direct.layout.type = PatternLayout
appender.direct.layout.pattern = ${pattern}
appender.direct.policies.type = Policies
appender.direct.policies.time.type = TimeBasedTriggeringPolicy
appender.direct.policies.time.interval = 1
appender.direct.policies.time.modulate = true
appender.direct.policies.size.type = SizeBasedTriggeringPolicy
appender.direct.policies.size.size = 20KB
appender.direct.strategy.type = DirectWriteRolloverStrategy
appender.direct.strategy.maxFiles = 10
appender.direct.strategy.compressionLevel = 6

# ── Compression formats: the filePattern suffix selects the codec ────────────
appender.zip.type = RollingFile
appender.zip.name = Zip
appender.zip.fileName = ${dir}/zip/app.log
appender.zip.filePattern = ${dir}/zip/app-%i.log.zip
appender.zip.layout.type = PatternLayout
appender.zip.layout.pattern = ${pattern}
appender.zip.policy.type = SizeBasedTriggeringPolicy
appender.zip.policy.size = 20KB
appender.zip.strategy.type = DefaultRolloverStrategy
appender.zip.strategy.max = 5

# .zst/.xz/.bz2 need commons-compress (plus zstd-jni / xz)
appender.zstd.type = RollingFile
appender.zstd.name = Zstd
appender.zstd.fileName = ${dir}/zstd/app.log
appender.zstd.filePattern = ${dir}/zstd/app-%i.log.zst
appender.zstd.layout.type = PatternLayout
appender.zstd.layout.pattern = ${pattern}
appender.zstd.policy.type = SizeBasedTriggeringPolicy
appender.zstd.policy.size = 20KB
appender.zstd.strategy.type = DefaultRolloverStrategy
appender.zstd.strategy.max = 5

# ── RollingRandomAccessFile: same policies, ByteBuffer-backed IO ─────────────
appender.random.type = RollingRandomAccessFile
appender.random.name = RandomAccess
appender.random.fileName = ${dir}/random-access/app.log
appender.random.filePattern = ${dir}/random-access/app-%i.log.gz
appender.random.immediateFlush = false
appender.random.bufferSize = 262144
appender.random.layout.type = PatternLayout
appender.random.layout.pattern = ${pattern}
appender.random.policy.type = SizeBasedTriggeringPolicy
appender.random.policy.size = 20KB
appender.random.strategy.type = DefaultRolloverStrategy
appender.random.strategy.max = 5

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.composite.ref = Composite
rootLogger.appenderRef.cron.ref = Cron
rootLogger.appenderRef.direct.ref = DirectWrite
rootLogger.appenderRef.zip.ref = Zip
rootLogger.appenderRef.zstd.ref = Zstd
rootLogger.appenderRef.random.ref = RandomAccess