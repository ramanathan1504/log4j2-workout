# JDBC appender against embedded H2, in the properties format.
# Mirrors configs/xml/appender-jdbc.xml. Feature matrix §1, §7, §11.
#
# Three connection sources are shown. Only one can be active per appender, so
# the other two are on separate appenders you can point the root logger at.
#
# bufferSize=0 writes each event immediately. Anything above 0 batches, which
# means a crash loses the buffer and — more relevantly here — that a test
# asserting on table contents right after logging will find nothing.
#
# The schema is created by the DbBench application before Log4j initialises, in
# its static block. The JDBC appender does not create tables.
#
# Columns are ordinary nested components: each needs its own <id> segment, and
# `type` selects Column vs ColumnMapping. Two columns sharing an <id> silently
# become one, and the INSERT then has fewer columns than the table expects —
# which surfaces as a SQL error at write time, long after configuration.

status = WARN
name = appender-jdbc

# AUTO_SERVER lets the app's own connection and the appender's coexist
property.jdbcUrl = jdbc:h2:./logs/db/log4jdb;AUTO_SERVER=TRUE

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

# ── DriverManager: the simplest source, a new connection per batch ───────────
appender.jdbc.type = JDBC
appender.jdbc.name = Jdbc
appender.jdbc.tableName = LOG_EVENTS
appender.jdbc.bufferSize = 0
appender.jdbc.source.type = DriverManager
appender.jdbc.source.connectionString = ${jdbcUrl}
appender.jdbc.source.username = sa
appender.jdbc.source.password =
appender.jdbc.date.type = Column
appender.jdbc.date.name = EVENT_DATE
appender.jdbc.date.isEventTimestamp = true
appender.jdbc.level.type = Column
appender.jdbc.level.name = LEVEL
appender.jdbc.level.pattern = %level
appender.jdbc.logger.type = Column
appender.jdbc.logger.name = LOGGER
appender.jdbc.logger.pattern = %logger
appender.jdbc.message.type = Column
appender.jdbc.message.name = MESSAGE
appender.jdbc.message.pattern = %message
appender.jdbc.thread.type = Column
appender.jdbc.thread.name = THREAD
appender.jdbc.thread.pattern = %thread
appender.jdbc.marker.type = Column
appender.jdbc.marker.name = MARKER
appender.jdbc.marker.pattern = %marker
appender.jdbc.traceid.type = Column
appender.jdbc.traceid.name = TRACE_ID
appender.jdbc.traceid.pattern = %X{traceId}
appender.jdbc.throwable.type = Column
appender.jdbc.throwable.name = THROWABLE
appender.jdbc.throwable.pattern = %ex{full}

# ── PoolingDriver: DBCP2 connection pool. Needs log4j-jdbc-dbcp2. ────────────
appender.jdbcpooled.type = JDBC
appender.jdbcpooled.name = JdbcPooled
appender.jdbcpooled.tableName = LOG_EVENTS
appender.jdbcpooled.bufferSize = 0
appender.jdbcpooled.source.type = PoolingDriver
appender.jdbcpooled.source.connectionString = jdbc:apache:commons:dbcp:log4jPool
appender.jdbcpooled.source.poolName = log4jPool
appender.jdbcpooled.source.factory.type = PoolableConnectionFactory
appender.jdbcpooled.source.factory.maxConnLifetimeMillis = 60000
appender.jdbcpooled.date.type = Column
appender.jdbcpooled.date.name = EVENT_DATE
appender.jdbcpooled.date.isEventTimestamp = true
appender.jdbcpooled.level.type = Column
appender.jdbcpooled.level.name = LEVEL
appender.jdbcpooled.level.pattern = %level
appender.jdbcpooled.logger.type = Column
appender.jdbcpooled.logger.name = LOGGER
appender.jdbcpooled.logger.pattern = %logger
appender.jdbcpooled.message.type = Column
appender.jdbcpooled.message.name = MESSAGE
appender.jdbcpooled.message.pattern = %message

# ── ColumnMapping: types beyond strings — dates, MDC maps, whole layouts
#    written into a single column ──────────────────────────────────────────────
appender.jdbcmapped.type = JDBC
appender.jdbcmapped.name = JdbcMapped
appender.jdbcmapped.tableName = LOG_EVENTS_JSON
appender.jdbcmapped.bufferSize = 0
appender.jdbcmapped.source.type = DriverManager
appender.jdbcmapped.source.connectionString = ${jdbcUrl}
appender.jdbcmapped.source.username = sa
appender.jdbcmapped.source.password =
appender.jdbcmapped.date.type = ColumnMapping
appender.jdbcmapped.date.name = EVENT_DATE
appender.jdbcmapped.date.columnType = java.sql.Timestamp
appender.jdbcmapped.level.type = ColumnMapping
appender.jdbcmapped.level.name = LEVEL
appender.jdbcmapped.level.pattern = %level
appender.jdbcmapped.mdc.type = ColumnMapping
appender.jdbcmapped.mdc.name = MDC_MAP
appender.jdbcmapped.mdc.columnType = org.apache.logging.log4j.spi.ThreadContextMap
# A full layout serialised into one column
appender.jdbcmapped.json.type = ColumnMapping
appender.jdbcmapped.json.name = EVENT_JSON
appender.jdbcmapped.json.layout.type = JsonTemplateLayout
appender.jdbcmapped.json.layout.eventTemplateUri = classpath:EcsLayout.json

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.jdbc.ref = Jdbc
