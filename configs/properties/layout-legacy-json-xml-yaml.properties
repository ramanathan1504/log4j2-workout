# The Jackson-backed legacy layouts, in the properties format.
# Mirrors configs/xml/layout-legacy-json-xml-yaml.xml. Feature matrix §2, §11.
#
# The layout type keywords are the plugin names — JsonLayout, XmlLayout,
# YamlLayout, HtmlLayout — not "Json"/"Xml"/"Yaml". Getting one wrong does not
# fail loudly: the layout element is dropped, the appender falls back to its
# default layout, and you get plain text where you expected JSON.
#
# Unlike the XML, JsonLayout's boolean attributes have to be spelled out as
# strings here; the properties format has no types, so everything is converted
# from text by the plugin's own type converter.

status = WARN
name = layout-legacy-json-xml-yaml

# ── JsonLayout: the pre-JsonTemplateLayout JSON writer ───────────────────────
# compact=false pretty-prints; eventEol=true still terminates each event with a
# newline, which is what makes the output line-oriented enough to grep.
appender.json.type = Console
appender.json.name = Json
appender.json.target = SYSTEM_OUT
appender.json.layout.type = JsonLayout
appender.json.layout.compact = false
appender.json.layout.eventEol = true
appender.json.layout.properties = true
appender.json.layout.includeStacktrace = true
appender.json.layout.stacktraceAsString = false
appender.json.layout.includeTimeMillis = true

# ── XmlLayout ────────────────────────────────────────────────────────────────
appender.xml.type = Console
appender.xml.name = Xml
appender.xml.target = SYSTEM_OUT
appender.xml.layout.type = XmlLayout
appender.xml.layout.compact = false
appender.xml.layout.properties = true
appender.xml.layout.includeStacktrace = true

# ── YamlLayout ───────────────────────────────────────────────────────────────
appender.yaml.type = Console
appender.yaml.name = Yaml
appender.yaml.target = SYSTEM_OUT
appender.yaml.layout.type = YamlLayout
appender.yaml.layout.properties = true
appender.yaml.layout.includeStacktrace = true

# ── HtmlLayout ───────────────────────────────────────────────────────────────
appender.html.type = File
appender.html.name = Html
appender.html.fileName = logs/layout-html/report.html
appender.html.append = false
appender.html.layout.type = HtmlLayout
appender.html.layout.title = Log4j Bench — HtmlLayout
appender.html.layout.contentType = text/html
appender.html.layout.charset = UTF-8
appender.html.layout.locationInfo = true

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.json.ref = Json
rootLogger.appenderRef.html.ref = Html