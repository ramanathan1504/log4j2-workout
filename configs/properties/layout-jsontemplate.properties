# JsonTemplateLayout, in the properties format.
# Mirrors configs/xml/layout-jsontemplate.xml. Feature matrix §5, §11.
#
# The custom template is loaded from configs/templates/bench-custom.json. Inline
# is not a realistic option here: a properties value is a single logical line,
# so a multi-line JSON template would have to be one continued line of escapes.
#
# The URI must be absolute — a relative "file:configs/..." fails to read
# regardless of working directory — so it is built from ${sys:user.dir}.
#
# Note the layout type keyword: `JsonTemplateLayout`, not `layout.type = Json`.
# The legacy JsonLayout is a different plugin entirely; see
# configs/properties/layout-legacy-json-xml-yaml.properties.

status = WARN
name = layout-jsontemplate

# ── Log4j's own JSON shape ───────────────────────────────────────────────────
appender.default.type = Console
appender.default.name = Default
appender.default.target = SYSTEM_OUT
appender.default.layout.type = JsonTemplateLayout
appender.default.layout.eventTemplateUri = classpath:JsonLayout.json

# ── Elastic Common Schema, produced by Log4j itself (not the Elastic jar) ────
appender.ecs.type = Console
appender.ecs.name = Ecs
appender.ecs.target = SYSTEM_OUT
appender.ecs.layout.type = JsonTemplateLayout
appender.ecs.layout.eventTemplateUri = classpath:EcsLayout.json
appender.ecs.layout.service.type = EventTemplateAdditionalField
appender.ecs.layout.service.key = service.name
appender.ecs.layout.service.value = log4j-bench
appender.ecs.layout.env.type = EventTemplateAdditionalField
appender.ecs.layout.env.key = service.environment
appender.ecs.layout.env.value = bench

# ── Graylog GELF ─────────────────────────────────────────────────────────────
appender.gelf.type = Console
appender.gelf.name = Gelf
appender.gelf.target = SYSTEM_OUT
appender.gelf.layout.type = JsonTemplateLayout
appender.gelf.layout.eventTemplateUri = classpath:GelfLayout.json

# ── Google Cloud Logging ─────────────────────────────────────────────────────
appender.gcp.type = Console
appender.gcp.name = Gcp
appender.gcp.target = SYSTEM_OUT
appender.gcp.layout.type = JsonTemplateLayout
appender.gcp.layout.eventTemplateUri = classpath:GcpLayout.json

# ── The bench's own template ─────────────────────────────────────────────────
appender.custom.type = Console
appender.custom.name = Custom
appender.custom.target = SYSTEM_OUT
appender.custom.layout.type = JsonTemplateLayout
appender.custom.layout.eventTemplateUri = file:${sys:user.dir}/configs/templates/bench-custom.json

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
# Add the others to see one event in every standard shape at once.
rootLogger.appenderRef.custom.ref = Custom