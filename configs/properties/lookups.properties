# Every built-in lookup, used from a CONFIGURATION, in the properties format.
# Mirrors configs/xml/lookups.xml. Feature matrix §9, §11.
#
#   $   resolved ONCE, while the configuration is built — right for a file name
#   $$  deferred, resolved per event — required for MDC, markers, structured data
#
# An unresolvable lookup does NOT become empty: the expression is left verbatim.
# Literal text means unresolved, empty means resolved-to-empty — different
# failures. ${docker:}, ${web:}, ${spring:} and ${jndi:} resolve to nothing here
# by design; jndi has been off by default since 2.17.0 and this bench does not
# set log4j2.enableJndiLookup.

status = WARN
name = lookups

property.dir = ${sys:bench.log.dir:-logs}/lookups
property.javaVersion = ${sys:java.version}
property.userName = ${sys:user.name:-unknown}
property.home = ${env:HOME:-no-home}
property.benchEnv = ${env:BENCH_ENV:-unset}
property.javaRuntime = ${java:runtime}
property.javaVm = ${java:vm}
property.javaOs = ${java:os}
property.javaLocale = ${java:locale}
property.javaHw = ${java:hw}
property.startDate = ${date:yyyy-MM-dd}
property.appName = ${bundle:bench-messages:app.name}
property.appTier = ${bundle:bench-messages:app.tier}
property.tierUpper = ${upper:${bundle:bench-messages:app.tier}}
property.hostLower = ${lower:${env:HOSTNAME:-LOCALHOST}}
property.configLocation = ${log4j:configLocation}
property.configParent = ${log4j:configParentLocation}
property.firstArg = ${main:0:-none}
property.containerId = ${docker:containerId:-not-in-docker}
property.jndiValue = ${jndi:java:comp/env/benchName}
property.springProfile = ${spring:spring.profiles.active:-no-spring}

appender.resolved.type = File
appender.resolved.name = Resolved
appender.resolved.fileName = ${dir}/${startDate}-${appTier}.log
appender.resolved.append = false
appender.resolved.layout.type = PatternLayout
appender.resolved.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n

# The doubled $ defers these to each event; a single $ would resolve once
# against the context the configuration was built in, i.e. empty forever.
appender.perevent.type = File
appender.perevent.name = PerEvent
appender.perevent.fileName = ${dir}/per-event.log
appender.perevent.append = false
appender.perevent.layout.type = PatternLayout
appender.perevent.layout.pattern = %d{HH:mm:ss.SSS} %-5level ctx=$${ctx:traceId:-none} map=$${map:event:-none} marker=$${marker:name:-none} sd=$${sd:type:-none} event=$${event:Level} - %msg%n

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n
appender.console.layout.header = == config-time lookups ==============================%n  app          ${appName} (${appTier} / ${tierUpper})%n  java         ${javaVersion} ${javaVm}%n  runtime      ${javaRuntime}%n  os           ${javaOs}%n  hw           ${javaHw}%n  locale       ${javaLocale}%n  user         ${userName}%n  home         ${home}%n  BENCH_ENV    ${benchEnv}%n  host(lower)  ${hostLower}%n  date         ${startDate}%n  config       ${configLocation}%n  config dir   ${configParent}%n  argv[0]      ${firstArg}%n  docker       ${containerId}%n  jndi         ${jndiValue}%n  spring       ${springProfile}%n=====================================================%n

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.resolved.ref = Resolved
rootLogger.appenderRef.perevent.ref = PerEvent
