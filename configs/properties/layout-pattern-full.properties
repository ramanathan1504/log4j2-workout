# PatternLayout with (nearly) every converter switched on, in the properties
# format. Mirrors configs/xml/layout-pattern-full.xml. Feature matrix §4, §11.
#
# Two escaping rules collide in this file, and getting them confused is the
# usual reason a properties pattern comes out wrong:
#
#   * java.util.Properties reads the file first. A trailing backslash continues
#     the logical line, and leading whitespace on the continuation is stripped —
#     which is why every label line below carries an explicit \n and its own
#     indentation is written as \ escapes would be pointless: the leading spaces
#     shown here are inside the value only because they follow the \n, not
#     because of how the line is wrapped.
#   * PatternLayout reads the resulting string second, and takes % and { }.
#
# So \n is consumed by Properties (becoming a real newline) while %n is consumed
# by PatternLayout (becoming the platform line separator). Both appear below and
# they are not interchangeable.

status = WARN
name = layout-pattern-full

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %n== event ======================================================%n\
\  date             %d{yyyy-MM-dd HH:mm:ss.SSS}\n\
\  date(ISO8601)    %d{ISO8601}\n\
\  date(UNIX)       %d{UNIX_MILLIS}\n\
\  date(tz+locale)  %d{EEEE dd MMMM yyyy}{UTC}{de-DE}\n\
\  relative         %r ms since JVM start\n\
\  level            %p / %-5level / %highlight{%level}\n\
\  logger           %c\n\
\  logger{36}       %c{36}\n\
\  logger{1.}       %c{1.}\n\
\  class            %C\n\
\  method           %M\n\
\  file:line        %F:%L\n\
\  location         %l\n\
\  fqcn             %fqcn\n\
\  thread           %t (id %T, priority %tp)\n\
\  processId        %pid{-}\n\
\  sequenceNumber   %sn\n\
\  nanoTime         %N\n\
\  uuid(time)       %u{TIME}\n\
\  uuid(random)     %u{RANDOM}\n\
\  marker           %marker\n\
\  markerSimple     %markerSimpleName\n\
\  endOfBatch       %endOfBatch\n\
\  MDC(all)         %X\n\
\  MDC(traceId)     %X{traceId}\n\
\  NDC              %x\n\
\  map              %K{event}\n\
\  traceId (otel)   %traceId\n\
\  spanId  (otel)   %spanId\n\
\  traceFlags       %traceFlags\n\
\  message          %m\n\
\  message(nolook)  %m{nolookups}\n\
\  --- transforms ---\n\
\  encode(HTML)     %encode{%m}{HTML}\n\
\  encode(JSON)     %encode{%m}{JSON}\n\
\  maxLength(24)    %maxLen{%m}{24}\n\
\  replace          %replace{%m}{\\s+}{_}\n\
\  repeat           %repeat{=}{20}\n\
\  notEmpty         %notEmpty{[%marker] }\n\
\  equals           %equals{%level}{INFO}{<-- it was INFO>}\n\
\  equalsIgnoreCase           %equalsIgnoreCase{%level}{info}{<-- matched ignoring case>}\n\
\  style            %style{styled text}{bold,magenta}\n\
\  --- throwable ---\n\
\  throwable        %throwable{short}\n\
\  extended         %xEx{3}\n\
\  rootFirst        %rEx{3}\n\
== end ========================================================%n

logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console