# Every filter, at every scope, in the properties format.
# Mirrors configs/xml/filter-all.xml. Feature matrix §3, §11.
#
# Scopes are expressed by where the `filter.` segment sits in the key:
#   1. context-wide  filter.<id>.*
#   2. logger        logger.<id>.filter.<id>.*
#   3. appender-ref  logger.<id>.appenderRef.<id>.filter.<id>.*
#   4. appender      appender.<id>.filter.<id>.*
#
# The <id> segments are arbitrary grouping keys, not names — they only have to
# be unique within their prefix. Reusing one silently merges two filters into
# one, which is the failure mode to watch for in this format.
#
# ── Why this file is shaped differently from the XML ─────────────────────────
#
# The XML puts ten filters on one appender by wrapping them in <Filters>. The
# properties format cannot do that. A composite is expressible in principle —
#
#   appender.console.filter.all.type = Filters
#   appender.console.filter.all.marker.type = MarkerFilter
#
# — but PropertiesConfigurationBuilder.createFilter() calls
# builder.newFilter(type, onMatch, onMismatch) unconditionally, so the composite
# is always built carrying onMatch/onMismatch attributes, and CompositeFilter
# declares neither. Every such config logs
#
#   ERROR Filters contains invalid attributes "onMatch", "onMismatch"
#
# to the status logger. The configuration does still load, but the bench treats
# status-logger errors as failures (see README, "Failure detection"), so a
# permanent spurious error here would mask real ones.
#
# Without a composite, appender / logger / appender-ref scopes take exactly ONE
# filter each. So the filters are spread across one appender apiece, each
# writing to its own file under logs/filter-all/. That covers all sixteen
# filters, and has a side benefit the XML version does not: each file shows
# precisely which events its own filter admitted.

status = WARN
name = filter-all

property.threshold = DEBUG
property.dir = ${sys:bench.log.dir:-logs}/filter-all
property.pattern = %d{HH:mm:ss.SSS} %-5level %notEmpty{[%marker] }%logger{1.} - %msg%n

# ── Scope 1: context-wide ────────────────────────────────────────────────────
# The one scope that does accept several filters: the builder combines root
# filters itself, without going through the CompositeFilter plugin.
filter.threshold.type = ThresholdFilter
filter.threshold.level = ${threshold}
filter.threshold.onMatch = NEUTRAL
filter.threshold.onMismatch = DENY

filter.time.type = TimeFilter
filter.time.start = 00:00:00
filter.time.end = 23:59:59
filter.time.timezone = UTC
filter.time.onMatch = NEUTRAL
filter.time.onMismatch = DENY

filter.burst.type = BurstFilter
filter.burst.level = TRACE
filter.burst.rate = 20
filter.burst.maxBurst = 100
filter.burst.onMatch = NEUTRAL
filter.burst.onMismatch = DENY

# ── Scope 4: appender-level, one filter each ─────────────────────────────────
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}
appender.console.filter.marker.type = MarkerFilter
appender.console.filter.marker.marker = SECURITY
appender.console.filter.marker.onMatch = ACCEPT
appender.console.filter.marker.onMismatch = NEUTRAL

appender.errors.type = Console
appender.errors.name = Errors
appender.errors.target = SYSTEM_ERR
appender.errors.layout.type = PatternLayout
appender.errors.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1.} - %msg%n%xEx{5}
appender.errors.filter.threshold.type = ThresholdFilter
appender.errors.filter.threshold.level = ERROR
appender.errors.filter.threshold.onMatch = ACCEPT
appender.errors.filter.threshold.onMismatch = DENY

appender.nomarker.type = File
appender.nomarker.name = NoMarker
appender.nomarker.fileName = ${dir}/no-marker.log
appender.nomarker.append = false
appender.nomarker.layout.type = PatternLayout
appender.nomarker.layout.pattern = ${pattern}
appender.nomarker.filter.nomarker.type = NoMarkerFilter
appender.nomarker.filter.nomarker.onMatch = NEUTRAL
appender.nomarker.filter.nomarker.onMismatch = DENY

appender.levelmatch.type = File
appender.levelmatch.name = LevelMatch
appender.levelmatch.fileName = ${dir}/level-match.log
appender.levelmatch.append = false
appender.levelmatch.layout.type = PatternLayout
appender.levelmatch.layout.pattern = ${pattern}
appender.levelmatch.filter.levelmatch.type = LevelMatchFilter
appender.levelmatch.filter.levelmatch.level = ERROR
appender.levelmatch.filter.levelmatch.onMatch = ACCEPT
appender.levelmatch.filter.levelmatch.onMismatch = DENY

appender.levelrange.type = File
appender.levelrange.name = LevelRange
appender.levelrange.fileName = ${dir}/level-range.log
appender.levelrange.append = false
appender.levelrange.layout.type = PatternLayout
appender.levelrange.layout.pattern = ${pattern}
# minLevel/maxLevel read in severity order: FATAL is the most severe bound.
appender.levelrange.filter.levelrange.type = LevelRangeFilter
appender.levelrange.filter.levelrange.minLevel = FATAL
appender.levelrange.filter.levelrange.maxLevel = TRACE
appender.levelrange.filter.levelrange.onMatch = NEUTRAL
appender.levelrange.filter.levelrange.onMismatch = DENY

appender.regex.type = File
appender.regex.name = Regex
appender.regex.fileName = ${dir}/regex.log
appender.regex.append = false
appender.regex.layout.type = PatternLayout
appender.regex.layout.pattern = ${pattern}
# useRawMsg=false matches the formatted message, i.e. after parameter
# substitution — which is the only way a secret in a parameter gets caught.
appender.regex.filter.regex.type = RegexFilter
appender.regex.filter.regex.regex = .*(password|secret|token).*
appender.regex.filter.regex.useRawMsg = false
appender.regex.filter.regex.onMatch = DENY
appender.regex.filter.regex.onMismatch = NEUTRAL

appender.stringmatch.type = File
appender.stringmatch.name = StringMatch
appender.stringmatch.fileName = ${dir}/string-match.log
appender.stringmatch.append = false
appender.stringmatch.layout.type = PatternLayout
appender.stringmatch.layout.pattern = ${pattern}
appender.stringmatch.filter.stringmatch.type = StringMatchFilter
appender.stringmatch.filter.stringmatch.text = internal-only
appender.stringmatch.filter.stringmatch.onMatch = DENY
appender.stringmatch.filter.stringmatch.onMismatch = NEUTRAL

appender.tcm.type = File
appender.tcm.name = ThreadContextMap
appender.tcm.fileName = ${dir}/thread-context-map.log
appender.tcm.append = false
appender.tcm.layout.type = PatternLayout
appender.tcm.layout.pattern = ${pattern}
appender.tcm.filter.tcm.type = ThreadContextMapFilter
appender.tcm.filter.tcm.operator = or
appender.tcm.filter.tcm.onMatch = NEUTRAL
appender.tcm.filter.tcm.onMismatch = DENY
appender.tcm.filter.tcm.tenant.type = KeyValuePair
appender.tcm.filter.tcm.tenant.key = tenant
appender.tcm.filter.tcm.tenant.value = acme-corp
appender.tcm.filter.tcm.user.type = KeyValuePair
appender.tcm.filter.tcm.user.key = userId
appender.tcm.filter.tcm.user.value = alice

appender.dynamic.type = File
appender.dynamic.name = DynamicThreshold
appender.dynamic.fileName = ${dir}/dynamic-threshold.log
appender.dynamic.append = false
appender.dynamic.layout.type = PatternLayout
appender.dynamic.layout.pattern = ${pattern}
# Per-user threshold: everyone gets INFO, alice gets TRACE.
appender.dynamic.filter.dynamic.type = DynamicThresholdFilter
appender.dynamic.filter.dynamic.key = userId
appender.dynamic.filter.dynamic.defaultThreshold = INFO
appender.dynamic.filter.dynamic.onMatch = NEUTRAL
appender.dynamic.filter.dynamic.onMismatch = NEUTRAL
appender.dynamic.filter.dynamic.alice.type = KeyValuePair
appender.dynamic.filter.dynamic.alice.key = alice
appender.dynamic.filter.dynamic.alice.value = TRACE

appender.map.type = File
appender.map.name = Map
appender.map.fileName = ${dir}/map.log
appender.map.append = false
appender.map.layout.type = PatternLayout
appender.map.layout.pattern = ${pattern}
# Matches MapMessage payloads only; ordinary messages are a mismatch.
appender.map.filter.map.type = MapFilter
appender.map.filter.map.operator = or
appender.map.filter.map.onMatch = NEUTRAL
appender.map.filter.map.onMismatch = DENY
appender.map.filter.map.checkout.type = KeyValuePair
appender.map.filter.map.checkout.key = event
appender.map.filter.map.checkout.value = checkout

appender.sd.type = File
appender.sd.name = StructuredData
appender.sd.fileName = ${dir}/structured-data.log
appender.sd.append = false
appender.sd.layout.type = PatternLayout
appender.sd.layout.pattern = ${pattern}
appender.sd.filter.sd.type = StructuredDataFilter
appender.sd.filter.sd.operator = or
appender.sd.filter.sd.onMatch = NEUTRAL
appender.sd.filter.sd.onMismatch = DENY
appender.sd.filter.sd.audit.type = KeyValuePair
appender.sd.filter.sd.audit.key = type
appender.sd.filter.sd.audit.value = audit

# NullAppender takes a name and nothing else — no layout, no filter. It is here
# to cover the plugin; DenyAllFilter is attached to its appender-ref below.
appender.blackhole.type = Null
appender.blackhole.name = Blackhole

# ── Loggers ──────────────────────────────────────────────────────────────────
logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE
logger.bench.additivity = false

# ── Scope 2: logger-level ────────────────────────────────────────────────────
logger.bench.filter.threshold.type = ThresholdFilter
logger.bench.filter.threshold.level = TRACE
logger.bench.filter.threshold.onMatch = NEUTRAL
logger.bench.filter.threshold.onMismatch = DENY

# ── Scope 3: appender-ref level — narrows this reference only ────────────────
logger.bench.appenderRef.console.ref = Console
logger.bench.appenderRef.console.filter.levelrange.type = LevelRangeFilter
logger.bench.appenderRef.console.filter.levelrange.minLevel = FATAL
logger.bench.appenderRef.console.filter.levelrange.maxLevel = TRACE
logger.bench.appenderRef.console.filter.levelrange.onMatch = NEUTRAL
logger.bench.appenderRef.console.filter.levelrange.onMismatch = DENY

logger.bench.appenderRef.errors.ref = Errors
logger.bench.appenderRef.errors.level = ERROR

# DenyAllFilter: the explicit way to say "nothing reaches this reference".
logger.bench.appenderRef.blackhole.ref = Blackhole
logger.bench.appenderRef.blackhole.filter.denyall.type = DenyAllFilter

logger.bench.appenderRef.nomarker.ref = NoMarker
logger.bench.appenderRef.levelmatch.ref = LevelMatch
logger.bench.appenderRef.levelrange.ref = LevelRange
logger.bench.appenderRef.regex.ref = Regex
logger.bench.appenderRef.stringmatch.ref = StringMatch
logger.bench.appenderRef.tcm.ref = ThreadContextMap
logger.bench.appenderRef.dynamic.ref = DynamicThreshold
logger.bench.appenderRef.map.ref = Map
logger.bench.appenderRef.sd.ref = StructuredData

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console