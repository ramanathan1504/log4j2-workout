# Baseline, in the properties format. Mirrors configs/xml/baseline-console.xml.
# Feature matrix §11 — PropertiesConfigurationFactory.
#
# The properties format is flat: nesting is expressed by dotted prefixes, and
# the segment after the type keyword is an arbitrary local ID used only to group
# keys. `appender.console.name` is what the rest of the config refers to;
# `console` in `appender.console.*` is just the grouping key.
#
# Note this is the LOG4J 2 properties format, not the Log4j 1.x one. They look
# similar and are not compatible — see configs/log4j1/log4j.properties for 1.x.
#
# It is also 2.x-only. PropertiesConfigurationFactory does not exist in Log4j 3:
# log4j-config-properties ships JavaPropsConfigurationFactory instead, a Jackson
# java-properties reader whose keys mirror the JSON/YAML tree rather than this
# flat dotted syntax. Running any file in this directory on 3.x therefore falls
# back to the default configuration, silently — the bench banner's "loaded" line
# is how you notice.

status = WARN
name = baseline-console

# ── Appenders ────────────────────────────────────────────────────────────────
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n%throwable

# ── Loggers ──────────────────────────────────────────────────────────────────
logger.bench.name = org.apache.logging.bench
logger.bench.level = TRACE

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console
