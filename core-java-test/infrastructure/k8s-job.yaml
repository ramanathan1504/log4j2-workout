# ─────────────────────────────────────────────────────────────────────────
# Core Java Log4j2 Test — Kubernetes Job
#
# Apply:
#   kubectl apply -f core-java-test/infrastructure/k8s-job.yaml
#
# Watch logs:
#   kubectl logs -f job/core-java-log4j-test
#
# Switch to async config:
#   Set LOG4J_CONFIG env var to "log4j2-async.xml"
# ─────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: core-java-log4j-test
  labels:
    app: core-java-log4j-test
    log4j-version: "2.25.3"
spec:
  # Auto-delete Job and pods 5 minutes after completion
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: core-java-log4j-test
    spec:
      restartPolicy: Never
      containers:
        - name: core-java-log4j-test
          image: core-java-test:latest
          imagePullPolicy: IfNotPresent
          env:
            # Switch between log4j2.xml (sync) and log4j2-async.xml (async)
            - name: LOG4J_CONFIG
              value: "log4j2.xml"
            # Expose pod name as MDC-enrichable env var
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

