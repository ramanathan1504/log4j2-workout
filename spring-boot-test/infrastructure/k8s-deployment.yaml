# ─────────────────────────────────────────────────────────────────────────
# Spring Boot Log4j2 Test — Kubernetes Deployment + Service
#
# Apply:
#   kubectl apply -f spring-boot-test/infrastructure/k8s-deployment.yaml
#
# Test endpoints inside cluster:
#   kubectl port-forward svc/spring-boot-log4j2-test 8081:80
#   curl http://localhost:8081/api/logs/all
#   curl http://localhost:8081/actuator/health
#
# Watch logs (JSON output from Log4j):
#   kubectl logs -f deployment/spring-boot-log4j2-test
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-log4j2-test
  labels:
    app: spring-boot-log4j2-test
    log4j-version: "2.25.3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-log4j2-test
  template:
    metadata:
      labels:
        app: spring-boot-log4j2-test
    spec:
      containers:
        - name: spring-boot-log4j2-test
          image: spring-boot-log4j2-test:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            # Switch between log4j2.xml (sync) and log4j2-async.xml (async)
            - name: LOG4J_CONFIG
              value: "log4j2.xml"
            - name: SERVER_PORT
              value: "8081"
            # Inject pod/node info — usable in MDC via System.getenv()
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Liveness: restart pod if app is deadlocked
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: remove pod from Service if not ready to accept traffic
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-log4j2-test
  labels:
    app: spring-boot-log4j2-test
spec:
  selector:
    app: spring-boot-log4j2-test
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8081
  type: ClusterIP

