spring:
  application:
    name: spring-boot-log4j2-test
  mvc:
    async:
      request-timeout: 600000 # 10 minutes

server:
  port: 8081
  tomcat:
    connection-timeout: 600000 # 10 minutes in milliseconds

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, loggers
  endpoint:
    health:
      show-details: always
      # Enable Kubernetes liveness/readiness probe endpoints
      probes:
        enabled: true
    loggers:
      enabled: true   # POST /actuator/loggers/{name} to change levels at runtime
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ── Logging — points Spring Boot to our log4j2.xml ───────────────────────
logging:
  config: classpath:log4j2.xml

