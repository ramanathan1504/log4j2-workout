@version: 4.8
@include "scl.conf"

# Accepts both BSD (RFC3164) and RFC5424 over TCP and UDP, so a single container
# serves both the SyslogAppender's protocol variants. Everything received is
# written to /var/log/received.log, which is bind-mounted to infra/output/syslog.

source s_net {
    network(
        transport("udp")
        port(514)
        flags(no-parse)
    );
    network(
        transport("tcp")
        port(514)
        flags(no-parse)
    );
};

destination d_file {
    file("/var/log/received.log"
        template("${ISODATE} <${PRI}> ${MSG}\n")
    );
};

log {
    source(s_net);
    destination(d_file);
};
