# Backing services for the appenders that need something real to talk to.
#
# Nothing starts automatically. Bring up only what the appender under test needs:
#
#   docker compose -f infra/docker-compose.yml up -d kafka
#   docker compose -f infra/docker-compose.yml up -d mongodb postgres
#   docker compose -f infra/docker-compose.yml --profile observability up -d
#
# Ports are the conventional defaults so the configs under configs/ can hardcode
# localhost:<default> and just work.

name: log4j-bench

services:

  # ── Kafka appender ────────────────────────────────────────────────────────
  # KRaft mode: no Zookeeper needed.
  #
  # The APACHE image, not bitnami/kafka — Bitnami withdrew its Docker Hub tags
  # in 2025 and `bitnami/kafka:3.9` no longer resolves at all. The env var names
  # differ: the Apache image takes KAFKA_* (which map to server.properties keys),
  # Bitnami took KAFKA_CFG_*. A config written for one is silently ignored by the
  # other, and the broker then starts with defaults that do not match the ports
  # you published.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── NoSQL appenders ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: log4j
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

  cassandra:
    image: cassandra:5
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: log4j-bench
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: log4j
      COUCHDB_PASSWORD: log4j

  # ── JDBC / JPA appenders ──────────────────────────────────────────────────
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: log4j
      POSTGRES_USER: log4j
      POSTGRES_PASSWORD: log4j
    volumes:
      - ./sql/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log4j"]
      interval: 10s
      timeout: 5s
      retries: 6

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: log4j
      MYSQL_USER: log4j
      MYSQL_PASSWORD: log4j
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./sql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ── Syslog appender (BSD + RFC5424, TCP and UDP) ──────────────────────────
  syslog:
    # :latest, because the pinned 4.8.1 tag was withdrawn from Docker Hub.
    image: balabit/syslog-ng:latest
    command: ["--no-caps", "-F"]
    ports:
      - "5514:514/udp"
      - "5514:514/tcp"
    volumes:
      - ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./output/syslog:/var/log

  # ── SMTP appender. MailHog captures mail and serves a UI on 8025. ─────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # ── EcsLayout end-to-end ──────────────────────────────────────────────────
  # Under a profile: Elasticsearch is heavy and only needed to prove ECS output
  # is actually ingestible, rather than merely well-formed JSON.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: ["observability"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    profiles: ["observability"]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
