plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // We will switch this version during testing
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:classfile" << "-Werror"
}