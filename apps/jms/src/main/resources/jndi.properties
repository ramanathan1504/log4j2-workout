# The JNDI environment, read from the classpath by every InitialContext in this
# JVM — including the one Log4j's JmsManager builds for itself.
#
# This file exists because system properties cannot do the job. InitialContext
# copies only the standard java.naming.* properties from System.getProperties();
# arbitrary keys like connectionFactory.X are ignored, so Artemis's context
# factory would fall back to its own defaults (tcp://localhost:61616) and the
# appender would fail with "JMS message producer not available" — an error that
# says nothing about where it tried to connect.
java.naming.factory.initial=org.apache.activemq.artemis.jndi.ActiveMQInitialContextFactory

# In-VM transport: no port, no listener, nothing to start first.
connectionFactory.ConnectionFactory=vm://0

# The name the appender's destinationBindingName refers to.
queue.queue/log4jBenchQueue=log4jBenchQueue
