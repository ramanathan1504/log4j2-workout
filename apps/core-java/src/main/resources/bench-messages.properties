# A ResourceBundle for ${bundle:} to resolve against.
#
# The bundle lookup is the only one that needs something on the classpath rather
# than in the environment, which is why it is usually the one left unexercised:
# ${bundle:name:key} with no such bundle resolves to nothing and looks identical
# to a typo in the key.
#
# Referenced from configs/*/lookups.* as ${bundle:bench-messages:app.name}.

app.name = Log4j Bench
app.owner = logging-log4j2
app.tier = bench
